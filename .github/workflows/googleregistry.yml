name: Build and Upload to Google Artifact registry

on:
  workflow_dispatch:
  push:
    tags:
      - '*'

env:
  PROJECT_ID: ahdis-ch
  GAR_LOCATION: europe-west6
  REPOSITORY: ahdis
  IMAGE: smart-ehr-launcher

jobs:
  setup-build-publish-deploy:
    name: Setup, Build, Publish, and Deploy
    runs-on: ubuntu-latest
    environment: production

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          version: latest
          platforms: linux/amd64

      # Configure Workload Identity Federation and generate an access token.
      - id: 'auth'
        name: 'Authenticate to Google Cloud'
        uses: google-github-actions/auth@v3
        with:
          token_format: 'access_token'
          workload_identity_provider: 'projects/1022310475153/locations/global/workloadIdentityPools/github-wif-pool/providers/oidc-github-provider'
          service_account: 'github@ahdis-ch.iam.gserviceaccount.com'

      - name: Docker configuration
        run: |-
          echo ${{steps.auth.outputs.access_token}} | docker login -u oauth2accesstoken --password-stdin https://$GAR_LOCATION-docker.pkg.dev

      # config.json is loaded at runtime, so the image is environment-neutral:
      # mount the deployment's config over /usr/share/nginx/html/config.json.
      # amd64 only: the Dockerfile pins its build stage to $BUILDPLATFORM, so a
      # multi-arch manifest would be wrong.
      - name: Build
        run: |-
          docker buildx build \
            --tag "$GAR_LOCATION-docker.pkg.dev/$PROJECT_ID/$REPOSITORY/$IMAGE:$GITHUB_REF_NAME" \
            --push \
            --platform=linux/amd64 \
            .
